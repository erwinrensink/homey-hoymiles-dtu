<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Achtergrond -->
  <rect width="500" height="500" rx="100" fill="#0f172a" />
  
  <!-- Oranje zon -->
  <circle cx="250" cy="220" r="120" fill="#f59e0b" />
  
